<script>
/* App name in the phone's language. Android reads the translations straight from
   manifest.json; Safari on iPhone does not, so there the manifest is rebuilt here
   with the name already translated, before "Add to Home Screen" reads it. */
(function () {
  var NAMES = { es: '¿Quién empieza?', ca: 'Qui comença?', gl: 'Quen comeza?', en: 'Who goes first?',
    fr: 'Qui commence ?', de: 'Wer fängt an?', it: 'Chi comincia?', pt: 'Quem começa?', nl: 'Wie begint?' };
  var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  var lang = 'en';
  for (var i = 0; i < prefs.length; i++) {
    var base = String(prefs[i]).toLowerCase().split('-')[0];
    if (NAMES[base]) { lang = base; break; }
  }
  var name = NAMES[lang];
  document.title = name;
  document.getElementById('app-title').setAttribute('content', name);
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) return;
  try {
    var here = function (path) { return new URL(path, location.href).href; };
    var manifest = {
      id: here('./'), name: name, short_name: name, lang: lang,
      start_url: here('./'), scope: here('./'), display: 'fullscreen',
      background_color: '#030427', theme_color: '#030427',
      icons: [
        { src: here('icon-192.png'), sizes: '192x192', type: 'image/png' },
        { src: here('icon-512.png'), sizes: '512x512', type: 'image/png' }
      ]
    };
    document.getElementById('manifest-link').setAttribute('href',
      'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));
  } catch (e) {}
})();
</script>

  #intro {

  #intro ol {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;

  .app-icon {
    width: 112px; height: 112px;
    border-radius: 26px;

    box-shadow: 0 10px 28px rgba(0, 0, 0, .45);

  #start {
    font: inherit;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.25rem;

  #start:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  #intro small {
    position: absolute;

    color: var(--ink-soft);
    font-size: .85rem;
    letter-spacing: .04em;

  #intro[hidden] { display: none; }

  /* Close cross: always on the play area, hidden while 2+ fingers are down */
  #close {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    z-index: 4;
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: rgba(3, 4, 39, .85);
    box-shadow: 0 4px 16px rgba(0, 0, 0, .45);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    animation: close-in .25s ease both;
  }
  #close[hidden] { display: none; }
  #close:active { transform: scale(.92); }
  #close:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  @keyframes close-in { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { #close { animation: none; } }
</style>

  // --- Texts: picked from the phone's language, English if none matches ---
  var TEXTS = {

          close: 'Schließen',
          mat: 'Touch-Bereich: Jeder Spieler legt einen Finger auf' },
    it: { title1: 'Chi', title2: 'comincia?',
          s1: 'Appoggiate il telefono sul tavolo.', s2: 'Ogni giocatore mette un dito e lo tiene fermo.', s3: 'Tre secondi di tensione e il telefono sceglie.',
          start: 'Inizia', idle: 'Mettete tutti un dito sullo schermo', idleSub: 'Da 2 a 7 giocatori',
          missing: 'Manca qualcuno', missingSub: 'Serve almeno un altro dito',
          ready: 'Ci siete tutti?', readySub: 'Fermi, si parte',
          win: 'Cominci tu!', winSub: 'Alzate le dita per ripetere',
          limit: 'Il telefono ha perso le dita', limitSub: 'Alcuni telefoni, come gli iPhone, ne rilevano solo 5 alla volta',
          close: 'Chiudi',
          mat: 'Area tattile: ogni giocatore mette un dito' },
    pt: { title1: 'Quem', title2: 'começa?',
          s1: 'Coloquem o telefone deitado na mesa.', s2: 'Cada jogador põe um dedo e fica quieto.', s3: 'Três segundos de tensão e o telefone escolhe.',
          start: 'Começar', idle: 'Todos com um dedo no telefone', idleSub: 'De 2 a 7 jogadores',
          missing: 'Falta alguém', missingSub: 'É preciso pelo menos mais um dedo',
          ready: 'Estão todos?', readySub: 'Dedos quietos, vai começar',
          win: 'Quem começa é você!', winSub: 'Levantem os dedos para repetir',
          limit: 'O telefone perdeu os dedos', limitSub: 'Alguns telefones, como os iPhone, só reconhecem 5 de cada vez',
          close: 'Fechar',
          mat: 'Zona tátil: cada jogador põe um dedo' },
    nl: { title1: 'Wie', title2: 'begint?',
          s1: 'Leg de telefoon plat op tafel.', s2: 'Elke speler legt één vinger neer en houdt die stil.', s3: 'Drie spannende seconden en de telefoon kiest.',
          start: 'Start', idle: 'Leg allemaal een vinger op het scherm', idleSub: '2 tot 7 spelers',
          missing: 'Er ontbreekt iemand', missingSub: 'Minstens nog één vinger nodig',
          ready: 'Is iedereen er?', readySub: 'Stilhouden, daar gaan we',
          win: 'Jij begint!', winSub: 'Til je vingers op om opnieuw te spelen',
          limit: 'De telefoon is de vingers kwijt', limitSub: 'Sommige telefoons, zoals iPhones, herkennen er maar 5 tegelijk',
          close: 'Sluiten',
          mat: 'Aanraakzone: elke speler legt één vinger neer' }
  };
  var lang = 'en';
  (function () {
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < prefs.length; i++) {
      var base = String(prefs[i]).toLowerCase().split('-')[0];
      if (TEXTS[base]) { lang = base; return; }
    }
  })();
  var T = TEXTS[lang];
  document.documentElement.lang = lang;
  document.title = T.title1 + ' ' + T.title2;
  document.getElementById('t-title1').textContent = T.title1;
  document.getElementById('t-title2').textContent = T.title2;
  document.getElementById('t-s1').textContent = T.s1;
  document.getElementById('t-s2').textContent = T.s2;
  document.getElementById('t-s3').textContent = T.s3;
  document.getElementById('start').textContent = T.start;
  canvas.setAttribute('aria-label', T.mat);
  document.getElementById('close').setAttribute('aria-label', T.close);

  // Handed out in this order: each new finger gets the colour most different
  // from those already on the table (red, blue, green, yellow, sky, orange, pink).
  var PALETTE = ['#FF4D5E', '#5B7CFF', '#3DDC84', '#FFD60A', '#38C6FF', '#FF8C1A', '#FF5CC8'];
  var MAX_PLAYERS = 7;
  var SETTLE_MS = 1200;     // quiet time before the countdown starts
  var COUNTDOWN_MS = 3000;  // pulsing time before choosing
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1;
  var fingers = new Map();  // identifier -> {x, y, color, born}
  var state = 'idle';       // idle | settling | countdown | chosen
  var lastChange = 0;
  var countdownStart = 0;
  var nextBeat = 0;
  var beat = 0;             // 1 right after a beat, decays to 0
  var winner = null;        // {x, y, color}
  var chosenAt = 0;
  var allLiftedAt = 0;
  var played = false;       // a first player has been picked since the start screen
  var noticeUntil = 0;      // shows the 'phone dropped the fingers' message until then

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  function buzz(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  // --- Sound: synthesised with Web Audio, no files needed ---
  var audio = null;
  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audio) audio = new AC();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) {}
  }
  function tone(freq, start, dur, type, vol) {
    if (!audio || audio.state !== 'running') return;
    try {
      var t0 = audio.currentTime + start;
      var osc = audio.createOscillator();
      var gain = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain); gain.connect(audio.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  function tickSound(prog) {
    // each beat climbs in pitch as the three seconds run out
    tone(392 + 500 * prog, 0, 0.09, 'triangle', 0.35);
    tone((392 + 500 * prog) / 2, 0, 0.12, 'sine', 0.25);
  }
  function winSound() {
    // rising fanfare: C5 E5 G5, then a held C6 chord
    var notes = [523.25, 659.25, 783.99];
    for (var i = 0; i < notes.length; i++) tone(notes[i], i * 0.11, 0.16, 'triangle', 0.4);
    tone(1046.5, 0.33, 0.75, 'triangle', 0.42);
    tone(783.99, 0.33, 0.75, 'sine', 0.25);
    tone(523.25, 0.33, 0.75, 'sine', 0.25);
  }

  function pickColor() {
    var used = new Set();
    fingers.forEach(function (f) { used.add(f.color); });
    for (var i = 0; i < PALETTE.length; i++) {
      if (!used.has(PALETTE[i])) return PALETTE[i];
    }
    return PALETTE[0];
  }

  function randomIndex(n) {
    if (window.crypto && crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      var limit = Math.floor(4294967296 / n) * n;
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function pos(t) {
    var r = canvas.getBoundingClientRect();
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function changed(now) {
    lastChange = now;
    if (state === 'chosen') return;
    if (fingers.size === 0) state = 'idle';
    else state = 'settling';   // also cancels a running countdown
    beat = 0;
  }

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var now = performance.now();
    if (state === 'chosen') return;
    noticeUntil = 0;
    var added = false;
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (fingers.size >= MAX_PLAYERS) break;   // extra fingers are ignored
      var t = e.changedTouches[i], p = pos(t);
      fingers.set(t.identifier, { x: p.x, y: p.y, color: pickColor(), born: now });
      added = true;
    }
    if (added) changed(now);
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i], f = fingers.get(t.identifier);
      if (f) { var p = pos(t); f.x = p.x; f.y = p.y; }
    }
  }, { passive: false });

  function lift(e) {
    e.preventDefault();
    var now = performance.now();
    var before = fingers.size, removed = false;
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (fingers.delete(e.changedTouches[i].identifier)) removed = true;
    }
    initAudio();   // wakes the sound again if the phone had paused it
    if (state === 'chosen') {
      if (e.touches.length === 0) allLiftedAt = now;
      return;
    }
    // The phone itself cancelled every finger at once: it hit its own touch limit
    if (e.type === 'touchcancel' && before >= 5 && fingers.size === 0) noticeUntil = now + 4500;
    if (removed) changed(now);   // lifting an ignored extra finger changes nothing
  }
  canvas.addEventListener('touchend', lift, { passive: false });
  canvas.addEventListener('touchcancel', lift, { passive: false });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.getElementById('start').addEventListener('click', function () {
    intro.hidden = true;
    initAudio();
    buzz(30);
    var el = document.documentElement;
    try {
      var p = el.requestFullscreen ? el.requestFullscreen() : null;
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
    setTimeout(resize, 300);
  });

  // --- Close cross: try to close; browsers usually refuse, so fall back to the start screen ---
  var closeBtn = document.getElementById('close');
  closeBtn.addEventListener('click', function () {
    try { window.close(); } catch (e) {}
    setTimeout(function () {
      fingers.clear();
      winner = null;
      allLiftedAt = 0;
      noticeUntil = 0;
      played = false;
      state = 'idle';
      closeBtn.hidden = true;
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          var p = document.exitFullscreen(); if (p && p.catch) p.catch(function () {});
        }
      } catch (e) {}
      intro.hidden = false;
    }, 150);
  });

  function setHint(main, sub, onColor, hidden) {
    if (hintMain.textContent !== main) hintMain.textContent = main;
    if (hintSub.textContent !== sub) hintSub.textContent = sub;
    hint.classList.toggle('on-color', !!onColor);
    hint.classList.toggle('hidden', !!hidden);
  }

  function choose(now) {
    var list = Array.from(fingers.values());
    var w = list[randomIndex(list.length)];
    winner = { x: w.x, y: w.y, color: w.color };
    state = 'chosen';
    played = true;
    chosenAt = now;
    allLiftedAt = 0;
    buzz([250, 90, 450]);
    winSound();
  }

  function update(now) {
    if (state === 'settling') {
      if (fingers.size >= 2 && now - lastChange >= SETTLE_MS) {
        state = 'countdown';
        countdownStart = now;
        nextBeat = now;
      }
    }
    if (state === 'countdown') {
      var prog = (now - countdownStart) / COUNTDOWN_MS;
      if (prog >= 1) { choose(now); }
      else if (now >= nextBeat) {
        beat = 1;
        buzz(35);
        tickSound(prog);
        nextBeat = now + (520 - 340 * prog);   // heartbeat speeds up
      }
    }
    if (state === 'chosen' && allLiftedAt && now - allLiftedAt > 1600) {
      fingers.clear();
      winner = null;
      state = 'idle';
    }
    beat *= 0.90;
    // always on the play area, hidden while two or more fingers are down
    var showClose = intro.hidden && fingers.size < 2;
    if (closeBtn.hidden === showClose) closeBtn.hidden = !showClose;

    if (state === 'idle') {
      if (now < noticeUntil) setHint(T.limit, T.limitSub);
      else setHint(T.idle, T.idleSub);
    }
    else if (state === 'settling') {
      if (fingers.size < 2) setHint(T.missing, T.missingSub);
      else setHint(T.ready, T.readySub);
    }
    else if (state === 'countdown') setHint('', '', false, true);
    else if (state === 'chosen') {
      var far = winner && Math.hypot(winner.x - W / 2, winner.y - H / 2) > 170;
      setHint(T.win, T.winSub, true, !far);
    }
  }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    if (state === 'chosen' && winner) {
      var t = Math.min(1, (now - chosenAt) / 450);
      var ease = 1 - Math.pow(1 - t, 3);
      var maxR = Math.hypot(Math.max(winner.x, W - winner.x), Math.max(winner.y, H - winner.y)) + 20;
      // winner colour floods the table
      ctx.fillStyle = winner.color;
      ctx.beginPath(); ctx.arc(winner.x, winner.y, maxR * ease, 0, Math.PI * 2); ctx.fill();
      // dark well around the chosen finger
      var breathe = reduceMotion ? 0 : Math.sin(now / 260) * 5;
      ctx.fillStyle = '#030427';
      ctx.beginPath(); ctx.arc(winner.x, winner.y, (104 + breathe) * ease, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = winner.color;
      ctx.beginPath(); ctx.arc(winner.x, winner.y, 62 * ease, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = winner.color;
      ctx.beginPath(); ctx.arc(winner.x, winner.y, (82 + breathe) * ease, 0, Math.PI * 2); ctx.stroke();
      return;
    }

    // colour throb of the whole table during the countdown
    if (state === 'countdown' && beat > 0.02) {
      ctx.fillStyle = 'rgba(243,239,226,' + (0.10 * beat).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    var prog = state === 'countdown' ? (now - countdownStart) / COUNTDOWN_MS : 0;
    fingers.forEach(function (f) {
      var age = Math.min(1, (now - f.born) / 180);
      var pop = 1 - Math.pow(1 - age, 3);
      var pulse = state === 'countdown' ? beat * (reduceMotion ? 0.06 : 0.28) : 0;
      var r = 50 * pop * (1 + pulse);
      var ringR = 70 * pop * (1 + pulse * 1.3);

      ctx.globalAlpha = 0.22 + (state === 'countdown' ? 0.3 * beat : 0);
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, ringR + 16, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();

      ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = f.color;
      ctx.beginPath();
      if (state === 'countdown') {
        // ring closes as the three seconds run out
        ctx.arc(f.x, f.y, ringR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.02, 1 - prog));
      } else {
        var a = reduceMotion ? 0 : now / 500;
        ctx.arc(f.x, f.y, ringR, a, a + Math.PI * 1.5);
      }
      ctx.stroke();
    });
  }

  function frame(now) {
    update(now);
    draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
